  notes: >
    The response options are the five top-level skill domains ("There are five categories of
    Essential Digital Skills for life and work"). Not reproduced: eight Foundation Skills that
    underpin all five domains (for example "I can turn on a device"), and, within each domain,
    separate Skills for life and Additional skills for work statements with worked examples. See the
    primary source.

    Tagged adults only: "The framework is intended to be used by everyone in the UK engaged in
    supporting adults to enhance their essential digital skills", with no mention of children or
    young people.

    This 2018 framework updates the 2015 Basic Digital Skills Framework. It was coordinated by
    Lloyds Banking Group and the Tech Partnership with a steering group including DfE, DCMS and DWP,
    and is used across government, for example in adult education funding and digital inclusion. The
    page was last updated 23 April 2019 and shows no withdrawal notice. DfE's separate "Essential
    digital skills standards: 2026" cover Entry Level 1 to 3 and Level 1 to 2 qualifications and say
    only that they "are aligned with the essential digital skills framework," not that they replace
    it, so this framework is treated as current. Re-check both pages in case that changes.

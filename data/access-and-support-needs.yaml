  items: null
  response_scale: null
  scoring: null
  notes: >
    A cross-government reference taxonomy of vulnerability risk factors — "single facts that may
    apply to a person or household" — developed through the SAVVI (Single Assessment/View of
    Vulnerability Information) programme and refined by the cross-government Vulnerabilities
    Working Group (Government Digital Service, DSIT, DCMS), intended for information systems that
    identify and support vulnerable people/households and need a shared language for sharing that
    information between systems and organisations. The 11 items above are the taxonomy's
    top-level categories only, quoted verbatim from the published HTML document; the source
    states these top-level categories (and any sub-categories) "are not usable as Risk Factors and
    are only intended to provide classification" — the actual leaf-level risk factors (the granular
    facts a system would actually flag) live one level down in that same document and in a
    companion machine-readable spreadsheet ("Taxonomy of Risk Factors (ODS)"), neither reproduced
    here given their size and rate of change — same pattern as the NS-SEC entry in
    demographics.yaml, which points to a fuller input-question-set document rather than
    reproducing it. Risk factors can also "extend" other risk factors in a documented hierarchy
    (if B extends A, B applying implies A applies) — see source_url for that structure. Two
    categories are explicitly incomplete as published: "Gender or sexual identity" is
    "intentionally not expanded for now – this will be expanded by the work of the Domain Expert
    Group on Person," and "Ethnicity" is "intentionally omitted for now" — so treat this as a
    growing, alpha-stage taxonomy (it sits under the wider "Vulnerabilities Data Standards Alpha"
    programme) rather than a finished closed list; re-check source_url before assuming the 11
    categories above are exhaustive or stable. `applies_to` is left empty: the taxonomy is scoped
    to "a Person or Household" generically, with no statement distinguishing adults from
    children/young people.

- id: fca-vulnerability-drivers-fg21-1
  label: FCA vulnerability drivers (FG21/1) — Health, Life events, Resilience, Capability
  source: Financial Conduct Authority
  source_type: regulatory-framework
  status: current
  last_reviewed: 2026-09-04
  source_published: 2021-02-01
  source_url: https://www.fca.org.uk/publication/finalised-guidance/fg21-1.pdf
  applies_to: []
  use_case: [support-needs-identification]
  question: null
  values: null
  licence_status: restricted
  licence_notes: >-
    The FG21/1 PDF itself carries the footer "© Financial Conduct Authority 2021 ... All rights
    reserved" (Pubref: 007407) — not Crown copyright and not marked OGL, contrary to what might be
    assumed for a UK regulator's published guidance. The FCA's own site-wide legal terms
    (fca.org.uk/legal) confirm this is deliberate: "The FCA or its licensors own the copyright and
    any other rights in all material on the Site;" permitted use is limited to "print and download
    extracts from this Site for personal use or for use within an individual firm or organisation
    only," with attribution required, and "You must not use any part of the content on this Site
    for commercial purposes without obtaining a licence to do so from the FCA or its licensors."
    The terms note that some FCA statistical outputs published jointly with the Bank of
    England/PRA are separately released under OGL, but FG21/1 guidance itself isn't identified as
    one of those. Given no confirmed public-domain/OGL basis for wholesale reproduction, this
    entry is reference-only (`values` null) per this repo's restricted-licence convention (see the
    SDQ/ORS/SRS/WEMWBS/RCADS entries in screening-tools.yaml for the same pattern) — the driver
    names and their one-line definitions are described in `notes` below only as short, attributed
    quotation for identification/citation purposes, not reproduced as structured, form-ready data.
  items: null
  response_scale: null
  scoring: null
  notes: >
    FG21/1 ("Guidance for firms on the fair treatment of vulnerable customers," February 2021) is
    the FCA's finalised guidance under section 139A of the Financial Services and Markets Act 2000,
    setting out what firms should do to treat vulnerable customers fairly under the FCA's
    Principles for Businesses. Paragraph 2.5, quoted directly: "All customers are at risk of
    becoming vulnerable and this risk is increased by characteristics of vulnerability related to
    4 key drivers" — "Health – health conditions or illnesses that affect ability to carry out
    day-to-day tasks," "Life events – life events such as bereavement, job loss or relationship
    breakdown," "Resilience – low ability to withstand financial or emotional shocks," and
    "Capability – low knowledge of financial matters or low confidence in managing money (financial
    capability). Low capability in other relevant areas such as literacy, or digital skills." The
    guidance stresses (2.6, 2.10) these drivers are illustrative not exhaustive, frequently
    overlap, and can be transient or persistent (2.13). A fuller table of example characteristics
    per driver ("Table 1: Characteristics associated with the 4 drivers of vulnerability") exists
    in the source but isn't reproduced here — the table's column layout didn't extract reliably
    from the PDF in this session (rows came out re-ordered across columns), and risking a
    misattributed example under the wrong driver seemed worse than pointing to source_url directly
    for the full table. Per 2.12, quoted directly: "the driver of vulnerability, health, largely
    overlaps with the protected characteristic 'disability' under the Equality Act" — cross-refer
    to ons-disability-equality-act-2010 in demographics.yaml, which is the separate legal-status
    test that overlap points to. As of the FCA's March 2025 review of firms' treatment of
    vulnerable customers, the FCA concluded its "existing guidance in FG21/1 remains appropriate"
    and has not updated it, though FG21/1 predates the Consumer Duty and firms are directed
    separately to the FCA's Consumer Duty pages for current expectations on outcomes monitoring and
    management information. `applies_to` is left empty: FG21/1 addresses "customers" generally
    without an explicit statement distinguishing adults from children/young people.

- id: ofgem-priority-services-register
  label: Priority Services Register (PSR) — energy sector, situations that may qualify
  source: Ofgem (Office of Gas and Electricity Markets)
  source_type: sector-eligibility-framework
  status: current

# NHS standards for identifying, recording, and flagging a person's information/communication
# support needs and reasonable adjustments — distinct from the disability *status* question in
# demographics.yaml (Equality Act 2010 test) and the impairment *type* question already tracked
# in mental-health.yaml (ons-impairment-standard). This domain covers the administrative flags a
# referral/intake form needs once a need has been identified, not the identification question
# itself. See ../README.md for schema.

- id: nhs-accessible-information-standard
  label: Accessible Information Standard (DAPB1605) — information and communication support needs
  source: NHS England / Data Alliance Partnership Board (DAPB)
  source_type: clinical-dataset
  status: current
  last_reviewed: 2026-08-31
  source_published: 2025-06-30
  source_url: https://www.england.nhs.uk/publication/accessible-information-standard/
  applies_to: []
  use_case: [clinical-record]
  question: null
  values:
    - "Accessible information – communication support"
    - "Accessible Information – requires communication professional"
    - "Accessible Information – requires specific contact method"
    - "Accessible Information – requires specific information format"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Mandatory standard requiring NHS and social care providers to identify, record, flag, share,
    meet and review the information and communication support needs of patients, service users and,
    where relevant, carers (for example British Sign Language, braille, easy read, or a
    communication professional). It "specifically applies to people who have information or
    communication support needs related to a disability, impairment or sensory loss."

    The four response options are coded subsets in the Data Dictionary for Care (dd4c), recorded as
    SNOMED CT, Read v2 or CTV3 codes, or as human-readable definitions on paper. There is no fixed
    question: providers must "establish one or more standard question to identify people's needs".
    The guidance gives an example, but only as an illustration, not official wording.

    No age group is tagged. The scope, "NHS and adult social care services," could mean all NHS
    services plus adult social care, or adult-only throughout; the source doesn't say. Check the
    source if age scope matters.

    Version 4.0, approved by the Data Assurance Board on 3 June 2025 and published 30 June 2025.
    Full conformance and assurance dates run to 30 June 2027. The Impairment harmonised standard
    entry covers the earlier "what type of impairment" question. The Reasonable Adjustment Digital
    Flag (DAPB4019) entry is the NHS Spine flag that shares these needs across care settings.


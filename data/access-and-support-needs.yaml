# NHS standards for identifying, recording, and flagging a person's information/communication
# support needs and reasonable adjustments — distinct from the disability *status* question in
# demographics.yaml (Equality Act 2010 test) and the impairment *type* question already tracked
# in mental-health.yaml (ons-impairment-standard). This domain covers the administrative flags a
# referral/intake form needs once a need has been identified, not the identification question
# itself. See ../README.md for schema.

- id: nhs-accessible-information-standard
  label: Accessible Information Standard (DAPB1605) — information and communication support needs
  source: NHS England / Data Alliance Partnership Board (DAPB)
  source_type: clinical-dataset
  status: current
  last_reviewed: 2026-08-31
  source_published: 2025-06-30
  source_url: https://www.england.nhs.uk/publication/accessible-information-standard/
  applies_to: []
  use_case: [clinical-record]
  question: null
  values:
    - "Accessible information – communication support"
    - "Accessible Information – requires communication professional"
    - "Accessible Information – requires specific contact method"
    - "Accessible Information – requires specific information format"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Mandatory NHS/social-care standard (version 4.0, approved by the Data Assurance Board
    3 June 2025, published 30 June 2025) requiring providers to identify, record, flag, share,
    meet, and review the information and communication support needs of patients, service users,
    and — where relevant — their carers, where those needs relate to a disability, impairment, or
    sensory loss (e.g. British Sign Language, braille, easy read, advocate/communication
    professional required). Source, quoted directly: "This specifically applies to people who
    have information or communication support needs related to a disability, impairment or
    sensory loss." The standard defines 4 coded subsets (listed above, quoted verbatim) within
    the Data Dictionary for Care (dd4c), recorded via SNOMED CT/Read v2/CTV3 codes in electronic
    systems or human-readable definitions on paper. Unlike a screening instrument, it does NOT
    mandate one fixed question — implementation guidance instead requires providers to "establish
    one or more standard question to identify people's needs" and gives only an illustrative
    example ("Please let us know: if you find it hard to read our letters; if you need someone to
    support you at appointments; if you need information in alternative formats..."), so `question`
    is left null rather than presenting that example as the official wording. `applies_to` is left
    empty deliberately: the standard's own scope language repeatedly says "NHS and adult social
    care services," which is ambiguous between (a) NHS services generally, which cover all ages,
    with "adult" qualifying only the social-care leg, and (b) adult-only scope throughout — the
    source doesn't resolve this explicitly, so don't guess; check source_url directly if the exact
    age scope matters for your form. Complements ons-impairment-standard (mental-health.yaml),
    which covers the earlier "what type of impairment" question — this standard is what a service
    does administratively once a communication/access need has been identified. See also
    nhs-reasonable-adjustment-digital-flag below, the NHS Spine flag that operationalises this
    standard's requirement to share needs across care settings. Full conformance/assurance dates
    run to 30 June 2027.


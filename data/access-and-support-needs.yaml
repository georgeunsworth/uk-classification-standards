    - "Community language support"
    - "Adjustments for providing additional support to patients"
    - "Adjustments for individual care requirements"
    - "Adjustments in relation to the environment of care"
    - "Adjustments to support additional needs"
    - "Bespoke reasonable adjustments"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    National digital flag on the NHS Spine, distinct from but linked to the Accessible
    Information Standard above. Source, quoted directly: "The Reasonable Adjustment Flag is part
    of the Patient Flags service. It is a national record that shows a person needs accommodations
    and may include details about their impairments and necessary adjustments," developed "to
    enable health and care workers to record, share and view details of reasonable adjustments
    across the NHS, wherever the person is treated." Legal basis is the Equality Act 2010
    reasonable-adjustments duty (see also the ons-disability-equality-act-2010 entry in
    demographics.yaml, which covers the separate disability-status question). Recording has two
    parts: an impairment-type code — reuses the same categories as ons-impairment-standard
    (mental-health.yaml), plus a "prefer not to say" option not present in that GSS standard, so
    check both if building a full picker — and the adjustment-category codes listed above
    (`values`), which describe the *type* of adjustment required rather than a diagnosis. No
    single fixed survey question is published for either part; codes are selected from a
    structured SNOMED CT picker rather than answered as free text, so `question` is left null, same
    as the administrative flags in referral-identifiers.yaml. `applies_to` is left empty: the
    source describes scope as "for health and social care workers in any care setting who are
    treating patients that require reasonable adjustments" without an explicit age statement —
    don't infer all-ages from the absence of a restriction. Compliance dates: implementation
    19 December 2025, full conformance 31 March 2027 (health) / 31 October 2027 (social care).


  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    A national record on the NHS Spine, part of the Patient Flags service, that "shows a person
    needs accommodations and may include details about their impairments and necessary adjustments".
    It was developed "to enable health and care workers to record, share and view details of
    reasonable adjustments across the NHS, wherever the person is treated." It is linked to, but
    distinct from, the Accessible Information Standard entry. The legal basis is the Equality Act
    2010 duty to make reasonable adjustments; the separate disability-status question is in the
    Measuring disability for the Equality Act 2010 entry.

    Recording has two parts. The first is an impairment-type code, using the categories of the
    Impairment harmonised standard plus a prefer-not-to-say option that standard lacks, so check
    both if you build a full picker. The second is the adjustment-category codes in the response
    options, which describe the type of adjustment needed, not a diagnosis. Neither part has a fixed
    question: codes are chosen from a structured SNOMED CT picker.

    No age group is tagged. The source scopes it "for health and social care workers in any care
    setting who are treating patients that require reasonable adjustments", with no age statement.
    Don't read all ages into the absence of a restriction.

    Implementation date 19 December 2025; full conformance 31 March 2027 (health) and 31 October
    2027 (social care).


  notes: >
    A cross-government reference taxonomy of vulnerability risk factors, "single facts that may
    apply to a person or household", giving systems that identify and support vulnerable people a
    shared language for exchanging that information. It came from the SAVVI (Single Assessment/View
    of Vulnerability Information) programme and was refined by the cross-government Vulnerabilities
    Working Group.

    The response options are the 11 top-level categories only, which "are not usable as Risk Factors
    and are only intended to provide classification". The risk factors a system would actually flag
    sit one level down, in the same document and a companion spreadsheet, and aren't reproduced here
    because of their size and rate of change. Risk factors can extend others in a hierarchy (if B
    extends A, A also applies); see the primary source.

    Two categories are incomplete: "Gender or sexual identity" is "intentionally not expanded for
    now" and "Ethnicity" is "intentionally omitted for now". The taxonomy is part of the
    "Vulnerabilities Data Standards Alpha" programme, so expect change and re-check the source
    before treating the categories as complete. No age group is tagged: the scope is "a Person or
    Household", with nothing separating adults from children.

- id: fca-vulnerability-drivers-fg21-1
  label: FCA vulnerability drivers (FG21/1) — Health, Life events, Resilience, Capability
  source: Financial Conduct Authority
  source_type: regulatory-framework
  status: current
  last_reviewed: 2026-09-04
  source_published: 2021-02-01
  source_url: https://www.fca.org.uk/publication/finalised-guidance/fg21-1.pdf
  applies_to: []
  use_case: [support-needs-identification]
  question: null
  values: null
  licence_status: restricted
  licence_notes: >-
    The FG21/1 PDF itself carries the footer "© Financial Conduct Authority 2021 ... All rights
    reserved" (Pubref: 007407) — not Crown copyright and not marked OGL, contrary to what might be
    assumed for a UK regulator's published guidance. The FCA's own site-wide legal terms
    (fca.org.uk/legal) confirm this is deliberate: "The FCA or its licensors own the copyright and
    any other rights in all material on the Site;" permitted use is limited to "print and download
    extracts from this Site for personal use or for use within an individual firm or organisation
    only," with attribution required, and "You must not use any part of the content on this Site
    for commercial purposes without obtaining a licence to do so from the FCA or its licensors."
    The terms note that some FCA statistical outputs published jointly with the Bank of
    England/PRA are separately released under OGL, but FG21/1 guidance itself isn't identified as
    one of those. Given no confirmed public-domain/OGL basis for wholesale reproduction, this
    entry is reference-only (`values` null) per this repo's restricted-licence convention (see the
    SDQ/ORS/SRS/WEMWBS/RCADS entries in screening-tools.yaml for the same pattern) — the driver
    names and their one-line definitions are described in `notes` below only as short, attributed
    quotation for identification/citation purposes, not reproduced as structured, form-ready data.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The FCA's finalised guidance (February 2021) on treating vulnerable customers fairly under its
    Principles for Businesses. Paragraph 2.5: "All customers are at risk of becoming vulnerable and
    this risk is increased by characteristics of vulnerability related to 4 key drivers" — "Health –
    health conditions or illnesses that affect ability to carry out day-to-day tasks," "Life events
    – life events such as bereavement, job loss or relationship breakdown," "Resilience – low
    ability to withstand financial or emotional shocks," and "Capability – low knowledge of
    financial matters or low confidence in managing money (financial capability). Low capability in
    other relevant areas such as literacy, or digital skills."

    The drivers are illustrative, often overlap, and can be transient or persistent (paragraphs 2.6,
    2.10, 2.13). Example characteristics for each driver are in Table 1 of the source.
    Paragraph 2.12 says health "largely
    overlaps with the protected characteristic 'disability' under the Equality Act"; see the
    Measuring disability for the Equality Act 2010 entry.

    After its March 2025 review, the FCA said its "existing guidance in FG21/1 remains appropriate"
    and has not updated it. FG21/1 predates the Consumer Duty; see the FCA's Consumer Duty pages for
    current expectations on outcomes monitoring and management information. No age group is tagged:
    it addresses customers generally.


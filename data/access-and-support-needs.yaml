  licence_notes: >-
    Quoted directly from the source PDF: "© Crown copyright 2018." The gov.uk publication page
    itself confirms "All content is available under the Open Government Licence v3.0, except
    where otherwise stated."
  items: null
  response_scale: null
  scoring: null
  notes: >
    `source_type` is set to `cross-government-taxonomy` rather than `official-classification`:
    although Department for Education is the sole publishing department listed on gov.uk today,
    this doesn't fit the `official-classification` examples in this repo's README (SOC, SIC, IMD,
    geography codes, school type — all ONS/DfE statistical or administrative classifications). The
    Essential Digital Skills Framework is instead a competency/skills model, whose 2018 update was
    "coordinated by Lloyds Banking Group and the Tech Partnership, overseen by a steering group
    including... DfE, DCMS, DWP" and numerous other public and private bodies (quoted directly from
    the source), and it's referenced across government (adult education funding, digital inclusion
    programmes) rather than used as a single department's administrative code list — closer in
    spirit to the actively-governed, multi-body taxonomies this repo files under
    `cross-government-taxonomy` (see the GOV.UK Taxonomy of Vulnerability Risk Factors entry
    above), even though it isn't literally a taxonomy of risk factors. Flag this choice for
    reconsideration if a better-fitting domain/type emerges. `values` above are the 5 top-level
    domain names, quoted verbatim from the source ("There are five categories of Essential Digital
    Skills for life and work"). Not reproduced here: each domain splits further into a
    "Foundation Skills" tier (8 device/connectivity basics that underpin all 5 domains, e.g. "I can
    turn on a device," "I can connect my device to a safe and secure Wi-Fi network") plus, within
    each of the 5 domains, separate "Skills for life" and "Additional skills for work" statement
    lists with worked examples — too granular for a compact `values` list, see source_url for the
    full statement-level detail (same reason NS-SEC/economic-activity-status in demographics.yaml
    leave their input-question detail to their source document rather than reproducing it here).
    `applies_to` is `[adults]` only: quoted directly, "The framework is intended to be used by
    everyone in the UK engaged in supporting adults to enhance their essential digital skills" —
    no statement extends this to children/young people. This is the first update of the "Basic
    Digital Skills Framework" (originally published 2015); last updated 23 April 2019, with no
    withdrawal notice found on the live gov.uk page. A separate, more recent DfE publication,
    "Essential digital skills standards: 2026" (gov.uk/government/publications/essential-digital-skills-standards-2026),
    exists alongside this framework — it covers Entry Level 1-3 and Level 1-2 qualification
    standards and states only that they "are aligned with the essential digital skills framework,"
    not that they replace it, so this framework entry is left `status: current` rather than
    superseded; re-check both pages if building against this if the relationship changes.

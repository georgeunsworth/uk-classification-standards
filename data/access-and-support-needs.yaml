- id: washington-group-short-set-functioning
  label: Washington Group Short Set on Functioning (WG-SS)
  source: Washington Group on Disability Statistics (UN Statistical Commission city group)
  source_type: international-standard
  status: current
  last_reviewed: 2026-09-04
  source_published: 2020-03-19
  source_url: https://www.washingtongroup-disability.com/question-sets/wg-short-set-on-functioning-wg-ss/
  applies_to: [adults]
  use_case: [support-needs-identification]
  question: null
  values: null
  licence_status: restricted
  licence_notes: >-
    No free-reproduction or "no permission required" statement was found anywhere in the WG's
    own materials checked for this entry (the WG-SS questionnaire PDF itself, the WG-SS question
    specifications document, and the short-set FAQ page all carry no copyright/permission text at
    all). The only explicit statement found is on the WG's own site-wide Terms & Conditions page
    (washingtongroup-disability.com/terms-conditions/), quoted directly: "no part of the site or
    of any material on it may be reproduced or used by anyone in any form or for any purpose
    whatsoever without their obtaining the prior written consent of WG or any other copyright
    holder," and separately, "No part of the site may be used for commercial gain, included in
    any other website, or transmitted in any form, or by any means, nor may any link to the site
    be created on a website." This is the opposite of the "free to reuse with attribution"
    reputation the WG-SS has informally — worldwide adoption in national censuses happens through
    National Statistical Offices' participation in the Washington Group process itself, not
    through an open reproduction licence available to any third party. Absent a confirmed
    public-domain or OGL basis, this is treated the same as the restricted screening instruments
    in screening-tools.yaml (SDQ, ORS, SRS, WEMWBS, RCADS) — reference-only, with
    question/values/items/response_scale/scoring all left null despite this being structurally a
    multi-item instrument like PHQ-9. **Flagged for human double-check**: it's plausible this
    generic site-wide T&C text is meant to cover the website's own content (page text, images,
    layout) rather than the WG-SS questionnaire itself, which the WG's entire mission is to see
    adopted verbatim worldwide — but no separate, more permissive statement specific to the
    question sets was found in this session to justify reading it that narrowly, so the
    conservative reading is used here.
  items: null
  response_scale: null
  scoring: null
  notes: >
    A 6-domain functional-difficulty screen (seeing, hearing, mobility, cognition, self-care,
    communication), developed and maintained by the Washington Group on Disability Statistics — a
    voluntary UN Statistical Commission city group of 100+ National Statistical Offices — for use
    in censuses and surveys worldwide, and incorporated into the UN's Principles and
    Recommendations for Population and Housing Censuses. Structurally this is a multi-item
    instrument like PHQ-9 (one 4-point response scale shared across all 6 items, read after each
    question), not reproduced here for licensing reasons (see licence_notes) but described for
    orientation: preamble "The next questions ask about difficulties you may have doing certain
    activities because of a HEALTH PROBLEM," then one question per domain (e.g. "Do you have
    difficulty seeing, even if wearing glasses?"), each offered the same 4 response categories —
    "No difficulty," "Some difficulty," "A lot of difficulty," "Cannot do at all" (plus
    interviewer-only "Refused"/"Don't know" codes). WG's own recommended analysis method for
    international comparability, quoted directly from their Short Set FAQ page
    (washingtongroup-disability.com/resources/frequently-asked-questions/short-set/): "The
    population disabled includes everyone with at least one domain that is coded as a lot of
    difficulty or cannot do it at all" — i.e. a "cut" at the third of four response levels, applied
    per domain, then combined with OR logic across all 6 domains. `applies_to` is set to
    `[adults]` only, not `children-young-people`, despite the source stating the questions are
    "designed to collect information on the population aged 5 years and above, with a
    knowledgeable proxy respondent providing information for children" (a proxy-response
    mechanism that would otherwise qualify under this repo's own `children-young-people`
    definition) — because the same source immediately qualifies that: "The WG-SS was not
    specifically designed for use among children, as it does not include key aspects of child
    development important for identifying disability in children and the wording of certain
    domains may not be relevant (or suitable) for children and adolescents," recommending the
    separate WG-UNICEF Module on Child Functioning (CFM) instead. Treating the age-5+/proxy
    mechanism as confirming child applicability would misrepresent WG's own explicit caveat, so
    the more cautious reading is used — check source_url directly, and consider the CFM instead,
    for any under-18 use case.

    Distinct from ons-disability-equality-act-2010 (demographics.yaml): that entry is a
    self-perceived, legal-impact test ("do you have a physical or mental health condition... that
    has lasted or is expected to last 12 months or more" and "does this reduce your ability to
    carry out day-to-day activities") tied to Equality Act 2010 protected-characteristic status,
    whereas WG-SS is a function-based measure of difficulty performing 6 specific basic actions,
    deliberately excluding mental health and designed for cross-national comparability rather than
    a legal test. These are not interchangeable, and ONS's own comparison found they identify
    substantially different populations: "Measuring disability: comparing approaches" (ONS, 6
    August 2019, ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/disability/articles/measuringdisabilitycomparingapproaches/2019-08-06),
    quoted directly: "The adult disability prevalence using the Equalities Act disability
    definition (EADD) was around three times that based on the most commonly used definition of
    the Washington Group Short Set of questions (WGSS)... The difference can be attributed partly
    to the exclusion of mental health issues from the WGSS, and partly to the higher severity
    threshold for inclusion in the Disability 3 measure" — and separately, that "less than half of
    the individuals included were counted as disabled by both definitions" even where broader WG
    indicators showed similar overall prevalence to the EADD. Don't assume a person who screens
    positive on one measure would screen positive on the other, or vice versa.


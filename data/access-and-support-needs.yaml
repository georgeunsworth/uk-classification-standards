    "Currently, only consumers who are disabled, chronically sick, or of pensionable age can get
    these services" was broadened so that suppliers and network operators must consider "any
    energy customers in vulnerable situations who need it – including those whose situation is
    temporary" — e.g. "customers with mental health issues which prevent them from understanding
    their bill, or who have injuries which stop them topping up their pre-payment meter." That
    press release is the clearest primary statement found that the current framework is meant to
    be assessed against individual circumstances rather than treated as a fixed, exhaustive
    category list, even though the live guidance page's own bulleted list (reproduced above) reads
    like one — check source_url directly rather than treating `values` as a closed set. **Flag for

  notes: >
    The granular, form-ready answer options behind nhs-reasonable-adjustment-digital-flag's
    11 category-level codes above — i.e. the actual "if so, what" values a service designer would
    offer as selectable options once someone has said yes to having an access/communication need.
    Verified directly against the live page's HTML (fetched and parsed, not taken from a summary)
    on 2026-08-31; each value here is the SNOMED CT description text for one coded concept (the
    numeric SNOMED CT codes themselves are on the source page but not reproduced here, consistent
    with how this repo's `values` field carries display labels, not codes, elsewhere). Scoped
    deliberately to the 5 categories most relevant to communication/access needs specifically —
    "Communication support," "Requires communication professional," "Requires specific contact
    method," "Requires specific information format," and "Additional communication needs and
    support." Two things from the same source are deliberately NOT reproduced here: (1) category
    6, "Community language support" — a separate reference set of roughly 190 language-interpreter
    codes (e.g. "Arabic language interpreter needed"), left out purely for size, see source_url for
    the full list; (2) categories 7-11 ("Adjustments for providing additional support to patients,"
    "individual care requirements," "environment of care," "additional needs," and "bespoke
    reasonable adjustments") — these are broader reasonable-adjustment/care-planning categories
    (e.g. wheelchair access, needle phobia, single room, guide dog) rather than communication/access
    needs specifically, so they're out of scope for this entry; see
    nhs-reasonable-adjustment-digital-flag above for their category-level names if you need the
    full flag. As with the other two entries in this file, no single fixed question is published —
    these are picked from a structured coded list, not answered as free text — so `question` is
    null and `applies_to` is left empty for the same reason given on nhs-reasonable-adjustment-digital-flag.

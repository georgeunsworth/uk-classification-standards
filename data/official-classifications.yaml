    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: values is null because SIC 2007 has 21 sections (single letters A-U), 88
    divisions (2-digit), 272 groups (3-digit), 615 classes (4-digit), plus UK-only 5-digit
    subclasses — far too many to compactly or safely list here without truncating; use the
    ONS Interactive SIC hierarchy tool linked from source_url for the full code list. The
    source page's own description, quoted verbatim, is "The current Standard Industrial
    Classification (SIC) used in classifying business establishments and other statistical
    units by the type of economic activity in which they are engaged" — no supersession banner
    is present. UK SIC 2007 is the UK's national version of NACE Rev. 2 (the EU's Statistical
    Classification of Economic Activities), identical to it down to and including the 4-digit
    class level. IMPORTANT CURRENCY FLAG: ONS has since published UK SIC 2026
    (https://www.ons.gov.uk/methodology/classificationsandstandards/ukstandardindustrialclassificationofeconomicactivities/uksic2026),
    finalised in April 2026 and formally published 3 August 2026 (668 classes across 22
    sections: 132 new codes, 98 retired, 614 unchanged from SIC2007), aligned to a newer NACE/
    ISIC revision. However, per the SIC2026 guidance page, "The Office for National Statistics
    (ONS) does not mandate the use of SIC classifications by external organisations," adoption
    is phased (Business Registers, then survey sampling, then National Accounts), and "the
    earliest anticipated use of SIC 2026 in National Accounts is the 2031 Blue Book
    publication" — SIC 2007 remains the operational classification for services and systems
    right now, but check source_url and the SIC2026 pages directly given how live this
    transition is; re-review this entry's status well before 2031.


  source_url: https://www.ons.gov.uk/methodology/classificationsandstandards/standardoccupationalclassificationsoc/soc2020
  applies_to: []
  use_case: [official-classification]
  question: null
  values:
    - "1 Managers, directors and senior officials"
    - "2 Professional occupations"
    - "3 Associate professional occupations"
    - "4 Administrative and secretarial occupations"
    - "5 Skilled trades occupations"
    - "6 Caring, leisure and other service occupations"
    - "7 Sales and customer service occupations"
    - "8 Process, plant and machine operatives"
    - "9 Elementary occupations"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    SOC 2020 is the current edition and supersedes SOC 2010. Only the nine major groups (1-digit
    codes) are listed here. They are the top of a four-level hierarchy: "SOC 2020 has nine major
    groups, 26 sub-major groups, 104 minor groups and 412 unit groups". The full unit-group list is
    in SOC 2020 Volume 1. ONS also publishes a six-digit extension of 1,384 Sub Unit Groups (SUGs).
    Its "six-digit structure of SOC2020 is treated as an extension to the classification", not a
    separate one:
    https://www.ons.gov.uk/methodology/classificationsandstandards/standardoccupationalclassificationsoc/standardoccupationalclassificationsocextensionproject

    ONS has run a consultation on revising SOC 2020, so check the primary source if a service
    depends on the exact unit-group set. The harmonised question documentation in the National
    Statistics Socio-economic Classification (NS-SEC) harmonised standard entry still derives NS-SEC
    from SOC 2010. For SOC 2020 alignment, use SOC 2020 Volume 3, which rebases NS-SEC on SOC 2020.

- id: ons-sic2007-standard
  label: UK Standard Industrial Classification of Economic Activities 2007 (SIC 2007)
  source: ONS / UK Standard Industrial Classification
  source_type: official-classification
  status: current
  last_reviewed: 2026-09-04
  source_published: 2008-01-01  # ONS's own page references "the original version - as published in 2008"
  source_url: https://www.ons.gov.uk/methodology/classificationsandstandards/ukstandardindustrialclassificationofeconomicactivities/uksic2007
  applies_to: []
  use_case: [official-classification]
  question: null
  values: null  # too many categories to compactly list — see notes
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    SIC 2007 has 21 sections (letters A to U), 88 divisions (2-digit), 272 groups (3-digit), 615
    classes (4-digit) and UK-only 5-digit subclasses, too many to list here. Use the ONS Interactive
    SIC hierarchy tool, linked from the primary source, for the full code list. It is the UK version
    of NACE Rev. 2, the EU's classification, and identical to it down to the 4-digit class level.

    ONS has since published UK SIC 2026
    (https://www.ons.gov.uk/methodology/classificationsandstandards/ukstandardindustrialclassificationofeconomicactivities/uksic2026),
    formally published on 3 August 2026. It has 668 classes across 22 sections (132 new codes, 98
    retired, 614 unchanged from SIC 2007). "The Office for National Statistics (ONS) does not
    mandate the use of SIC classifications by external organisations", and adoption is phased: "the
    earliest anticipated use of SIC 2026 in National Accounts is the 2031 Blue Book publication".
    For now, SIC 2007 remains the operational classification for services and systems. Check both
    classifications' pages, as the transition is live.

- id: mhclg-imd-2025-england
  label: Indices of Deprivation 2025 (IoD2025) — Index of Multiple Deprivation, England
  source: Ministry of Housing, Communities and Local Government (MHCLG)
  source_type: official-classification
  status: current
  last_reviewed: 2026-09-04
  source_published: 2025-10-30
  source_url: https://www.gov.uk/government/statistics/english-indices-of-deprivation-2025
  applies_to: []
  use_case: [official-classification]
  question: null
  values:
    - "Income Deprivation (22.5%)"
    - "Employment Deprivation (22.5%)"
    - "Education, Skills and Training Deprivation (13.5%)"
    - "Health Deprivation and Disability (13.5%)"
    - "Crime (9.3%)"
    - "Barriers to Housing and Services (9.3%)"
    - "Living Environment Deprivation (9.3%)"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IoD2025, published on 30 October 2025, is the current version and replaces IoD2019. It combines
    the seven weighted domains into the Index of Multiple Deprivation (IMD), the headline measure,
    for 33,755 Lower-layer Super Output Areas (LSOAs) in England. Supplementary indices, such as
    income deprivation affecting children or older people, are not reproduced here. It uses 55
    indicators (39 in IoD2019), with new ones such as anti-social behaviour, broadband connectivity,
    GP ratio and noise pollution. MHCLG also publishes a "Local Deprivation Explorer" lookup tool
    and technical reports: see the primary source.

    Each UK nation's index is a separate entry because methods, domains, weightings and dates
    differ. See the Scottish Index of Multiple Deprivation 2020 (SIMD 2020v2), Welsh Index of
    Multiple Deprivation 2025 (WIMD 2025) and Northern Ireland Multiple Deprivation Measure 2017
    (NIMDM 2017) entries.

- id: scotgov-simd-2020

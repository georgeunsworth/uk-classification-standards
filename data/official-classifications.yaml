- id: ons-local-authority-type-classification
  label: Local authority type classification (England)
  source: ONS Geography
  source_type: official-classification
  status: current
  last_reviewed: 2026-09-04
  source_published: 2023-01-03  # ONS names-and-codes-for-administrative-geography page's own "last updated" date
  source_url: https://www.ons.gov.uk/methodology/geography/ukgeographies/administrativegeography/england
  applies_to: []
  use_case: [official-classification]
  question: null
  values:
    - "Region (E12)"
    - "County (E10)"
    - "Metropolitan County (E11)"
    - "Non-Metropolitan District (E07)"
    - "Metropolitan District (E08)"
    - "Unitary Authority (E06)"
    - "London Borough (E09)"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The GSS entity-type code prefix is shown in brackets above (see ons-geography-hierarchy-
    gss-codes for how these fit into the wider nine-character GSS code structure). England's
    local government is two-tier in most of the country (County Councils plus District, Borough
    or City Councils underneath) and single-tier elsewhere (Unitary Authorities, London
    Boroughs, and Metropolitan Districts/Boroughs each provide all local services directly) —
    per GOV.UK's own plain-English description: "Many parts of England have 2 tiers of local
    government: county councils and district, borough or city councils. In some parts of the
    country, there's just 1 (unitary) tier of local government providing all the local
    services" (https://www.gov.uk/understand-how-your-council-works). District, borough, and
    city councils are all the same tier/type under this classification (E07 non-metropolitan
    district), differing only in the honorific the individual council uses, not in function or
    GSS entity code. Parish, town, and community councils sit below this classification
    entirely and aren't covered here. Scotland, Wales, and Northern Ireland each use their own
    single-tier local authority structures with their own GSS country-prefixed entity codes
    (S12, W06, N09 respectively) rather than this England-specific 6-type breakdown — check the
    relevant nation's page under https://www.ons.gov.uk/methodology/geography/ukgeographies/administrativegeography
    before assuming this classification applies UK-wide.

  source_type: official-classification
  status: current
  last_reviewed: 2026-09-04
  source_published: 2020-01-28
  source_url: https://www.gov.scot/collections/scottish-index-of-multiple-deprivation-2020/
  applies_to: []
  use_case: [official-classification]
  question: null
  values:
    - "Income"
    - "Employment"
    - "Health"
    - "Education, Skills and Training"
    - "Geographic Access to Services"
    - "Crime"
    - "Housing"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — this page's own footer
    states "All content is available under the Open Government Licence v3.0, except for
    graphic assets and where otherwise stated. © Crown Copyright" — see also this repo's
    LICENSE and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    SIMD ranks Scotland's 6,976 data zones from most deprived (rank 1) to least deprived (rank
    6,976), combining seven weighted domains. Income and Employment carry the most weight (28% each)
    and Access the least (9%). SIMD 2020 was first published on 28 January 2020. The v2 revision
    followed "a problem identified with the income domain ranks provided by the Department for Work
    and Pensions" and changed only the income domain ranks and overall SIMD ranks.

    SIMD 2020v2 is current; no SIMD 2026 has been published yet. The Scottish Government said in
    November 2024 that a SIMD 2026 update, timed to 2022 Census data zone geography, is anticipated
    for later in 2026. Check the primary source before relying on 2020v2 being current.

    See also the Indices of Deprivation 2025 (IoD2025) — Index of Multiple Deprivation, England,
    Welsh Index of Multiple Deprivation 2025 (WIMD 2025) and Northern Ireland Multiple Deprivation
    Measure 2017 (NIMDM 2017) entries.


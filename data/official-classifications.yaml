    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The ONS source page states "the current Standard Occupational Classification (SOC) for the
    UK is published in three volumes," confirming SOC2020 as current and superseding SOC2010
    (referenced only under "Related information" as the prior edition). The 9 major groups
    (1-digit codes) above are the top level of a four-level hierarchy — ONS's own Volume 1 page
    states verbatim "SOC 2020 has nine major groups, 26 sub-major groups, 104 minor groups and
    412 unit groups" (up from SOC2010's 9/25/90/369) — only the major-group level is reproduced

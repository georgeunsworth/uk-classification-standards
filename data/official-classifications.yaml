    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Published on 6 March 2025, this supersedes the 2011 Rural Urban Classification, which stays
    online for historical comparison only. The categories listed are for Output Areas. A coarser
    Local Authority District classification also exists (Rural majority, Intermediate rural,
    Intermediate urban, Urban): see the primary source for both. Areas are classed by address
    density, settlement form, population size and access to towns and cities of over 75,000 people.

    The method changed from 2011. The market and hub town treatment of settlements with
    10,000-30,000 population "has not been applied for the 2021 classification", so figures aren't
    directly comparable. Don't assume a straight read-across when moving a service from the 2011 to
    the 2021 classification.

- id: ons-output-area-classification-2021

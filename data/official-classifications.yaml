    groups) — its own documentation states this "six-digit structure of SOC2020 is treated as
    an extension to the classification," not a separate classification, so it's noted here
    rather than added as its own entry
    (https://www.ons.gov.uk/methodology/classificationsandstandards/standardoccupationalclassificationsoc/standardoccupationalclassificationsocextensionproject).
    A SOC2020 revision consultation has also been run by ONS since this review; check
    source_url directly if a live service depends on the exact current unit-group set. See also
    the ons-nssec-standard entry in demographics.yaml, whose notes flag that NS-SEC's harmonised
    question-battery documentation still derives NS-SEC from SOC2010 — ONS has separately
    published SOC2020-rebased NS-SEC guidance (SOC 2020 Volume 3:
    https://www.ons.gov.uk/methodology/classificationsandstandards/standardoccupationalclassificationsoc/soc2020/soc2020volume3thenationalstatisticssocioeconomicclassificationnssecrebasedonthesoc2020)
    for services needing SOC2020 alignment.


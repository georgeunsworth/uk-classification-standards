    release and technical/research reports — see source_url for the full suite. This is one of
    four nation-specific entries in this domain (see scotgov-simd-2020, welshgov-wimd-2025, and
    nisra-nimdm-2017) — deliberately not combined into one entry, since methodology, domain
    sets, weightings, and publication dates differ enough between the four nations that a

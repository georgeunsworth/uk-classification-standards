  scoring: null
  notes: >
    IMPORTANT — verified directly rather than assumed: IoD2025 has genuinely been published
    (30 October 2025), so it is the live, current version, not IoD2019 — check any prior
    assumption that "IoD2019 is still current" against this. Source states this release
    "updates the English Indices of Deprivation 2019" and combines the 7 weighted domains
    above into the Index of Multiple Deprivation (IMD), the headline combined measure, plus
    supplementary indices (e.g. income deprivation affecting children/older people) not

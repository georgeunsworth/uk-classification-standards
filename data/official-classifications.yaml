  source_published: 2025-01-01  # dataset page cites "version 3.2, January 2025"; exact day unconfirmed
  source_url: https://data.geods.ac.uk/dataset/output-area-classification-2021
  applies_to: []
  use_case: [official-classification]
  question: null
  values: null  # source doesn't publish a compact supergroup-name list on the dataset landing page itself — see notes
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 — the dataset page itself states "UK Open Government
    Licence (OGL)" and carries an Open Data badge — see this repo's LICENSE and README
    "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    A geodemographic classification of places, not people: "a hierarchical geodemographic
    classification across the UK which identifies areas of the country with similar
    characteristics". It has "8 different supergroups, into which are nested 21 groups and 52
    sub-groups". Their names aren't on the dataset page, so none are listed here; they are in the
    pen portraits and technical report linked from the primary source. It differs from the Rural
    Urban Classification 2021, which classifies by rurality and access.

    This UK-wide version (3.2, January 2025) supersedes the 2011 OAC. Don't cite the earlier England
    and Wales-only "2021 interim OAC" as current; ONS says it has "been superseded by the 2021 and
    2022 residential-based area classifications UK". For clustering at local authority rather than
    Output Area level, use the separate "2021/2022 Local Authority District Classification" (6
    supergroups, 19 groups, 32 subgroups, 374 UK local authorities), which has no entry here:
    https://www.ons.gov.uk/methodology/geography/geographicalproducts/areaclassifications/2021and2022residentialbasedareaclassifications

- id: ons-geography-hierarchy-gss-codes
  label: ONS statistical geography hierarchy and GSS coding system
  source: ONS Geography
  source_type: official-classification
  status: current
  last_reviewed: 2026-09-04
  source_published: null  # continuously maintained reference geography, not a single dated publication
  source_url: https://www.ons.gov.uk/methodology/geography/ukgeographies/statisticalgeographies
  applies_to: []
  use_case: [official-classification]
  question: null
  values:
    - "Output Area (OA)"
    - "Lower layer Super Output Area (LSOA)"
    - "Middle layer Super Output Area (MSOA)"
    - "Local Authority District"
    - "Region"
    - "Country"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Each level nests inside exactly one area at the level above, so data aggregates from Output Area
    up to Country without overlap or double-counting. Census 2021 definitions
    (https://www.ons.gov.uk/census/census2021dictionary/areatypedefinitions) give usually resident
    population ranges: OAs 100 to 625, LSOAs 1,000 to 3,000, MSOAs 5,000 to 15,000. Scotland and
    Northern Ireland use equivalent small areas with different names (Data Zones and Super Output
    Areas respectively), so check the relevant nation's statistics agency before using LSOA and MSOA
    terms.

    GSS (Government Statistical Service) codes identify every level. Each is a fixed nine-character
    code, used since 1 January 2011: a country letter (E England, W Wales, S Scotland, N Northern
    Ireland), two digits for the entity type (for example 01 = LSOA, 02 = MSOA) and six digits for
    the area. Codes are not hierarchical: "there is no relation between the code for a lower-tier
    area and the corresponding parent area". For local authority entity codes (E06 to E12), see the
    Local authority type classification (England) entry.

- id: dfe-gias-school-type-classification
  label: School/establishment type classification (Get Information about Schools, GIAS)
  source: Department for Education (DfE) / Get Information about Schools
  source_type: official-classification
  status: current
  last_reviewed: 2026-09-04
  source_published: null  # GIAS is a continuously updated live register, not a single dated publication
  source_url: https://get-information-schools.service.gov.uk/glossary
  applies_to: []
  use_case: [official-classification]
  question: null
  values: null  # GIAS doesn't publish one single compact canonical list of every establishment-type value on a static page — see notes
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 — the GIAS site footer states "All content is available
    under the Open Government Licence v3.0, except where otherwise stated" alongside a "©
    Crown copyright" notice — see also this repo's LICENSE and README "Sources & licensing"
    section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The definitive, current list is the GIAS "Type of establishment" field and its advanced-search
    filters. They can't be reliably extracted as static text, so no list is reproduced here rather
    than risk a partial or stale copy. Check them, and the broader "Establishment Type Group" field
    (which, for example, groups academies together), before building an eligibility or reporting
    field on this.

    The GIAS glossary defines types spanning maintained schools (for example Community School,
    Voluntary Aided School), academies (for example Academy Converter, Academy Sponsor Led), Free
    Schools, independent and non-maintained schools (Independent School, Independent Special School,
    Non-maintained Special School), alternative provision (Pupil Referral Unit, Secure 16 to 19
    Academy), and others such as University Technical Colleges, Sixth Form Colleges, Children's
    Centres and British Schools Overseas. Voluntary Controlled School is also a maintained category
    but wasn't defined on the glossary page when last checked.

- id: ons-local-authority-type-classification
  label: Local authority type classification (England)
  source: ONS Geography
  source_type: official-classification
  status: current
  last_reviewed: 2026-09-04
  source_published: 2023-01-03  # ONS names-and-codes-for-administrative-geography page's own "last updated" date
  source_url: https://www.ons.gov.uk/methodology/geography/ukgeographies/administrativegeography/england
  applies_to: []
  use_case: [official-classification]
  question: null
  values:
    - "Region (E12)"
    - "County (E10)"
    - "Metropolitan County (E11)"
    - "Non-Metropolitan District (E07)"
    - "Metropolitan District (E08)"
    - "Unitary Authority (E06)"
    - "London Borough (E09)"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The code in brackets is the GSS entity-type prefix; see the ONS statistical geography hierarchy
    and GSS coding system entry for the full code structure. Most of England has two tiers: County
    Councils, with District, Borough or City Councils beneath them. Elsewhere one tier (Unitary
    Authorities, London Boroughs, and Metropolitan Districts or Boroughs) provides all local
    services. District, borough and city councils are the same type here (E07 non-metropolitan
    district); the name doesn't change function or GSS code. Parish, town and community councils are
    not covered.

    This classification is England-only. Scotland, Wales and Northern Ireland have single-tier local
    authorities with their own codes (S12, W06 and N09 respectively): check that nation's page under
    https://www.ons.gov.uk/methodology/geography/ukgeographies/administrativegeography before
    assuming it applies.

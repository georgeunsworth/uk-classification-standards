- id: ons-geography-hierarchy-gss-codes
  label: ONS statistical geography hierarchy and GSS coding system
  source: ONS Geography
  source_type: official-classification
  status: current
  last_reviewed: 2026-09-04
  source_published: null  # continuously maintained reference geography, not a single dated publication
  source_url: https://www.ons.gov.uk/methodology/geography/ukgeographies/statisticalgeographies
  applies_to: []
  use_case: [official-classification]
  question: null
  values:
    - "Output Area (OA)"
    - "Lower layer Super Output Area (LSOA)"
    - "Middle layer Super Output Area (MSOA)"
    - "Local Authority District"
    - "Region"
    - "Country"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The source states "Output Areas (OAs) are the lowest level of geographical area for census
    statistics," "Lower layer Super Output Areas (LSOAs) are made up of groups of Output Areas
    (OAs)," and "Middle layer Super Output Areas (MSOAs) are made up of groups of Lower layer
    Super Output Areas (LSOAs)" — each level nests cleanly inside exactly one of the level
    above, so data aggregates upward from OA to LSOA to MSOA to Local Authority District to
    Region to Country without overlap or double-counting. Census 2021 area-type definitions
    (https://www.ons.gov.uk/census/census2021dictionary/areatypedefinitions) give population
    thresholds: OAs "usually resident population of between 100 and 625 persons," LSOAs
    "usually resident population between 1,000 and 3,000 persons," MSOAs "usually resident
    population between 5,000 and 15,000 persons." Scotland and Northern Ireland use equivalent
    but differently named small-area geographies (Data Zones and Super Output Areas
    respectively) rather than LSOA/MSOA — check the relevant nation's statistics agency before
    assuming LSOA/MSOA terminology applies UK-wide. GSS (Government Statistical Service) codes
    are the standard identifier for every level: a fixed nine-character alphanumeric code,
    implemented from 1 January 2011, replacing the previous hierarchical ONS coding scheme —
    "there is no relation between the code for a lower-tier area and the corresponding parent
    area" (source: ONS names-and-codes-for-administrative-geography page,
    https://www.ons.gov.uk/methodology/geography/geographicalproducts/namescodesandlookups/namesandcodeslistings/namesandcodesforadministrativegeography).
    The structure is a one-letter country prefix (e.g. E = England, W = Wales, S = Scotland, N
    = Northern Ireland), then two digits for the geography/entity type (e.g. 01 = LSOA, 02 =
    MSOA), then six digits uniquely identifying the individual instance — for example, English
    LSOA codes run E01017453-E01017554 in one worked example on the source page. See the
    ons-local-authority-type-classification entry below for the specific entity-type code
    prefixes (E06-E12) used for local authority geographies.


# UK classification standards relevant to mental health, as used in service design and reporting.
# See ../README.md for schema. This is a starter set — verify against source_url before relying on any entry.

- id: ons-long-lasting-health-conditions
  label: Long-lasting health conditions and illness harmonised standard
  source: ONS / Government Statistical Service (GSS) Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-08-30
  source_published: 2011-01-01  # year only in source; day/month unconfirmed
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/long-lasting-health-conditions-and-illness/
  applies_to: [adults, children-young-people]
  use_case: [demographic-survey]
  question: >-
    Do you have any physical or mental health conditions or illnesses lasting or
    expected to last for 12 months or more?
  values:
    - "Yes"
    - "No"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Doesn't distinguish physical from mental health conditions. Used in the 2021 Census (England
    and Wales) alongside the activity restriction standard. "Don't know" and "Refusal" can be
    recorded if volunteered, but the source says not to show them as options on the form. The
    question is asked directly of people aged 16 and over, with a proxy response (for example
    from a parent or carer) allowed for under-16s. Check the exact wording in the primary source
    before using it on a form for young people.

- id: ons-impairment-standard
  label: Impairment harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-08-30
  source_published: 2011-01-01  # year only in source; day/month unconfirmed
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/impairment/
  applies_to: [adults, children-young-people]
  use_case: [demographic-survey]
  question: >-
    Do you have any health conditions or illnesses which affect you in any of the
    following areas? (select all that apply)
  values:
    - "Vision (for example blindness or partial sight)"
    - "Hearing (for example deafness or partial hearing)"
    - "Mobility (for example walking short distances or climbing stairs)"
    - "Dexterity (for example lifting and carrying objects, using a keyboard)"
    - "Learning or understanding or concentrating"
    - "Memory"
    - "Mental health"
    - "Stamina or breathing or fatigue"
    - "Socially or behaviourally (for example associated with autism spectrum disorder (ASD)
      which includes Asperger's, or attention deficit hyperactivity disorder (ADHD))"
    - "Other (please specify)"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Its "mental or cognitive impairments" category covers memory, mental health, learning,
    understanding or concentrating, and social or behavioural impact. It can't be broken down
    by specific mental health condition. "None of the above" and "Refusal" are spontaneous-only:
    record them if volunteered, but don't show them as options. As with the Long-lasting health
    conditions and illness harmonised standard entry, the question is asked directly of people
    aged 16 and over, with proxy response allowed for under-16s. The question design dates from
    2008 and was under review as of phase 2 research in 2023.

- id: ons-mental-health-harmonisation-review
  label: Mental health harmonisation guidance (no preferred standard)
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: under-review
  last_reviewed: 2026-08-30
  source_published: 2023-03-28
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/review-of-mental-health-harmonisation
  applies_to: []  # no standard exists to confirm a population against
  use_case: [no-standard-gap]
  question: null  # no standard was adopted, so there is no question to quote
  values: null  # no standard exists
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    There is no preferred classification standard for mental health: the review was archived on
    28 March 2023 without recommending one. Existing harmonised standards (disability, impairment, wellbeing)
    give only narrow, fragmented mental health data and weren't designed to collect it. Treat
    this as an open gap, including for services for young people. The review sets no age scope
    for a future standard, but names children and young people, and people in institutional
    settings, as under-represented groups it found a need to capture better.

- id: nhs-mhsds-icd10
  label: Mental Health Services Data Set (MHSDS) — ICD-10 coded value sets
  source: NHS England / NHS Standards Directory
  source_type: clinical-dataset
  status: current
  last_reviewed: 2026-08-30
  source_published: null
  source_url: https://standards.nhs.uk/published-standards/mental-health-services-data-set
  applies_to: [adults, children-young-people]
  use_case: [clinical-record]
  question: null  # clinical/administrative dataset, not a single survey question
  values: null  # the standards.nhs.uk page itself doesn't publish a compact code list
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The closest thing to an authoritative coded value set for mental health conditions in an
    NHS context. It's a patient-level secondary uses dataset (SCCI0021, based on ICD-10 5th
    edition) for commissioning, service improvement and service design re-use, not a
    public-facing classification. The full ICD-10 code list (many hundreds of entries) isn't on
    the source page: it's in the linked Technical Output Specification and NHS Data Model and
    Dictionary. Scope: "children and adults in contact with mental health and wellbeing
    services". ICD-10 value sets are updated periodically, so confirm the current edition
    before use.

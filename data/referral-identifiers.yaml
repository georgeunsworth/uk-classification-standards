- id: nhs-consent-gap
  label: Consent to referral/treatment (no single official standard)
  source: NHS England
  source_type: clinical-dataset
  status: under-review
  last_reviewed: 2026-08-30
  source_published: null
  source_url: https://www.england.nhs.uk/long-read/consent-to-using-and-sharing-patient-information/
  applies_to: []
  use_case: [no-standard-gap]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    There is no single official coded "consent to referral/treatment" data standard in the NHS
    Data Model and Dictionary, so a referral form's consent field has no one official coded
    answer. Consent indicators exist only within specific datasets or registries, not as one
    reusable field. For example, a "Patient Consent Obtained Indicator" is defined separately
    for care-professional contact and for the National Joint Registry.

    The source, NHS England's consent policy long-read, is policy guidance rather than a coded
    standard. It sets out the requirements for informed consent under UK GDPR and DPA 2018
    (controller identity, purpose, data scope, right to withdraw). NHS Digital's Data Access
    Request Service (DARS) also publishes GDPR consent guidance. It isn't used as the source
    because its URL redirects and isn't a stable citation.

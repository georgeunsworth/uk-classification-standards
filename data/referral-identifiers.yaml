  items: null
  response_scale: null
  scoring: null
  notes: >
    The closest thing to an official coded safeguarding risk-flag standard, relevant to any
    safeguarding question on a referral form. The source says it is used "to identify an
    unresolved issue or concern regarding adult and child safeguarding that requires
    communication to another ORGANISATION or care agency", so it covers both adults and
    children. SNOMED CT Refset ID 999002381000000108, Refset FSN "Safeguarding issues simple
    reference set (foundation metadata concept)". Compare with the narrower, child-only
    Safeguarding Vulnerability Factors Indicator entry (nhs-safeguarding-vulnerability-indicator).


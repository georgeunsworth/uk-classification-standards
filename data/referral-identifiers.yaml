- id: nhs-consent-gap
  label: Consent to referral/treatment (no single official standard)
  source: NHS England
  source_type: clinical-dataset
  status: under-review
  last_reviewed: 2026-08-30
  source_published: null
  source_url: https://www.england.nhs.uk/long-read/consent-to-using-and-sharing-patient-information/
  applies_to: []
  use_case: [no-standard-gap]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: there is no single official coded "consent to referral/treatment" data standard in
    the NHS Data Model and Dictionary — consent indicators exist only per specific dataset or
    registry (e.g. a "Patient Consent Obtained Indicator" defined separately for care-professional
    contact and, separately again, for the National Joint Registry), not as one general-purpose,
    reusable field. Recorded here as a gap for the same reason the archived mental-health review and
    the sex/language/gender-identity gaps are recorded: a designer building a referral form needing
    a consent field will not find one official coded answer, and should treat that as a real
    constraint rather than a research failure. The linked source_url (NHS England's consent policy
    long-read) sets out the underlying legal/policy requirements for informed consent under UK
    GDPR/DPA 2018 (controller identity, purpose, data scope, right to withdraw) — useful context,
    but it's policy guidance, not a coded classification standard the way other entries here are.
    NHS Digital's Data Access Request Service (DARS) also publishes GDPR consent guidance, referenced
    for further context though not used as source_url here (its URL redirects and isn't a stable
    direct citation).

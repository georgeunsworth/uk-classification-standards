  response_scale: null
  scoring: null
  notes: >
    Source definition, quoted directly: used "to identify an unresolved issue or concern regarding
    adult and child safeguarding that requires communication to another ORGANISATION or care
    agency" — explicitly confirmed to span both adult and child safeguarding. SNOMED CT Refset ID
    999002381000000108, Refset FSN "Safeguarding issues simple reference set (foundation metadata
    concept)". This is the closest thing to an official coded safeguarding risk-flag standard —
    directly relevant to any safeguarding question on a referral form. Compare with the narrower,
    child-only nhs-safeguarding-vulnerability-indicator entry below.


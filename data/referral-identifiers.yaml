# NHS referral/administrative and safeguarding data standards commonly needed on a referral
# form, alongside the demographic and mental-health domains. See ../README.md for schema.
# Unlike the other two domains, none of these are survey questions — they're identifiers and
# coded flags, so `question` is null throughout; only the consent gap contributes to a
# question-centric view (as a "known gap," not a question).

- id: nhs-number
  label: NHS Number
  source: NHS England / NHS Data Model and Dictionary
  source_type: clinical-dataset
  status: current
  last_reviewed: 2026-08-30
  source_published: null
  source_url: https://www.datadictionary.nhs.uk/data_elements/nhs_number.html
  applies_to: []  # see notes — indirect evidence only, not an explicit population statement
  use_case: [clinical-record]
  question: null  # an identifier field, not a survey question
  values: null  # free-form 10-digit identifier, not a categorical value set
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The canonical patient identifier for tying a referral to a single NHS record. Without it,
    matching records and avoiding duplicates across services is unreliable. Source definition:
    "The NHS NUMBER, the primary identifier of a PERSON, is a unique identifier for a PATIENT
    within the NHS in England and Wales." Format: n10 (10 numeric digits). The source states no
    age scope, so no age group is tagged. Its use in birth-episode records and baby-specific
    address elements (for example "PATIENT USUAL ADDRESS (STRUCTURED (BABY))") suggests it
    applies at all ages, including newborns, but that is an inference.

- id: nhs-gp-practice-patient-registration
  label: General Medical Practice (Patient Registration)
  source: NHS England / NHS Data Model and Dictionary
  source_type: clinical-dataset
  status: current
  last_reviewed: 2026-08-30
  source_published: null
  source_url: https://www.datadictionary.nhs.uk/data_elements/general_medical_practice__patient_registration_.html
  applies_to: []
  use_case: [clinical-record]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Needed on a referral form for continuity of care and routing correspondence. The source
    defines it as: "GENERAL MEDICAL PRACTICE (PATIENT REGISTRATION) is the ORGANISATION CODE of
    the GP Practice that the PATIENT is registered with," supplied by the NHS Prescription
    Services. Default codes cover a patient not currently registered but eligible to be
    (V81997) and cases where registration status can't be determined (V81998).

    A similarly named but separate element, "GENERAL MEDICAL PRACTICE CODE (PATIENT
    REGISTRATION)", is also live in the Dictionary with a different format (fixed an6, against
    this element's min an6, max an8). Neither page says one supersedes the other, so don't
    assume it. Check the primary source for the currently recommended element name before use.


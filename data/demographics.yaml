# GSS Harmonised Standards for demographic fields commonly asked on UK referral/intake forms,
# beyond mental health. See ../README.md for schema. Verify against source_url before relying
# on any entry — several of these are marked "under development" by their own publisher.

- id: ons-ethnicity-standard
  label: Ethnicity harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-08-30
  source_published: 2011-08-01
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/ethnicity-harmonised-standard/
  applies_to: [adults, children-young-people]
  use_case: [demographic-survey]
  question: >-
    What is your ethnic group? (Choose one option that best describes your ethnic group or
    background)
  values:
    - "English/Welsh/Scottish/Northern Irish/British"
    - "Irish"
    - "Gypsy or Irish Traveller"
    - "Any other White background"
    - "White and Black Caribbean"
    - "White and Black African"
    - "White and Asian"
    - "Any other Mixed/Multiple ethnic background"
    - "Indian"
    - "Pakistani"
    - "Bangladeshi"
    - "Chinese"
    - "Any other Asian background"
    - "African"
    - "Caribbean"
    - "Any other Black/African/Caribbean background"
    - "Arab"
    - "Any other ethnic group"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The 18 England categories are shown as a flat list. See the primary source for how they are
    grouped (White; Mixed/Multiple; Asian/Asian British; Black/African/Caribbean/Black British;
    Other ethnic group) and for the Scotland, Wales and Northern Ireland variants.

    The standard has been under review since March 2022, driven by the Inclusive Data Taskforce. The
    source says to keep using it for existing collections until the review concludes.

    The question was "tested and designed for use with adult respondents aged 16 and over". For
    younger children, "guidance from parents/guardians may be needed", which is looser than a formal
    proxy-response rule. Check the source if the exact mechanism matters for your form.

    The same page says a GSS-wide language standard "is not offered due to a lack of user need". See
    the Main/preferred language (no GSS-wide harmonised standard) entry.

- id: ons-disability-equality-act-2010
  label: Measuring disability for the Equality Act 2010 (harmonisation guidance)
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-08-30
  source_published: 2019-06-25
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/measuring-disability-for-the-equality-act-2010/
  applies_to: [adults, children-young-people]
  use_case: [demographic-survey]
  question: >-
    Does your condition or illness/do any of your conditions or illnesses reduce your ability to
    carry out day-to-day activities?
  values:
    - "Yes, a lot"
    - "Yes, a little"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    This is the second half of the Equality Act 2010 disabled person test. A respondent counts as
    disabled under the Act only if they answer yes to both this question and the one in the
    Long-lasting health conditions and illness harmonised standard entry.

    Only the two yes options are confirmed from the source. A no option presumably exists but is
    unconfirmed, so check the primary source for the full set before using this in a live
    eligibility check.

    Respondents aged 16 and over answer for themselves. Proxy response is permitted for under-16s
    and for respondents too ill to answer, and translators can help non-English speakers.

    Updated 26 April 2023 in a 5-yearly Inclusive Data Taskforce review. Draft revised questions
    were expected by 2025; check whether they have been published.

- id: ons-sex-standard-gap
  label: Sex harmonisation guidance (no current standard)
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: under-review
  last_reviewed: 2026-08-30
  source_published: 2019-09-04
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/sex-harmonisation-guidance/
  applies_to: []  # no standard exists to confirm a population against
  use_case: [no-standard-gap]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    There is no harmonised standard for sex: "There is not currently a harmonised standard for
    collecting data on sex." The historical census categories on the page (Female, Male) are context
    only, not a recommendation.

    The GSS Harmonisation team is testing guidance and standards for two approaches: biological sex
    (sex at birth) and certificated sex (sex at birth or as modified by a Gender Recognition
    Certificate). Publication was expected in Summer 2026. The work was accelerated after the UK
    Supreme Court's April 2025 ruling on sex under the Equality Act 2010.

    If you need a legally defensible sex field now, treat this as an active gap and check the
    primary source for the latest position.


- id: ons-socio-economic-background-standard
  label: Socio-economic background harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-04
  source_published: 2023-07-07
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/socio-economic-background-harmonised-standard/
  applies_to: [adults]
  use_case: [demographic-survey]
  question: null
  values:
    - "Managerial, administrative, and professional occupations"
    - "Intermediate occupations"
    - "Small employers and own account workers"
    - "Lower supervisory and technical occupations"
    - "Semi-routine and routine occupations"
    - "Never worked and long-term unemployed"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Socio-economic background is derived from two questions about the respondent's circumstances
    "when you were aged about 14".

    "When you were aged about 14, what was the occupation of the main or highest income earner?"
    Options: "Professional occupations", "Managers, including senior, middle, or junior", "Clerical
    and intermediate occupations", "Routine, semi-routine manual or service occupations",
    "Technical and craft occupations", "I don't know", "Prefer not to say".

    "When you were aged about 14, what was the highest level of qualification achieved by either of
    your parents or guardians?" Options: "Degree level or degree equivalent or above",
    "Qualifications below degree level", "No qualifications", "I don't know or cannot remember",
    "Prefer not to say", "Not applicable".

    Neither question first asks which parent or guardian, or whether the respondent lived with them
    at 14.

    The employment questions follow the NS-SEC self-coded method. Outputs use NS-SEC classes (see
    the National Statistics Socio-economic Classification (NS-SEC) harmonised standard entry): the
    5-class version (6 categories) shown in the response options, and a 3-class version for coarser
    analysis.

    It is for adults recalling age 14; there is no other age scope. The team will review use of the
    questions "in around 5 years' time". There is no under-development banner, so it is treated as
    current.


  status: under-review
  last_reviewed: 2026-08-30
  source_published: 2019-09-04
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/sex-harmonisation-guidance/
  applies_to: []  # no standard exists to confirm a population against
  use_case: [no-standard-gap]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: the source states plainly "There is not currently a harmonised standard for
    collecting data on sex." Historical census categories ("Female"/"Male") are referenced on the
    page for context only, not as a current recommendation. The GSS Harmonisation team is
    conducting cognitive/usability testing and expects to publish new guidance and standards for
    two distinct approaches — biological sex (sex at birth) and certificated sex (sex at birth or as
    modified by a Gender Recognition Certificate) — in Summer 2026; this work was accelerated
    following the UK Supreme Court's April 2025 ruling on sex under the Equality Act 2010. Anyone
    needing a legally defensible sex field on a form right now should treat this as an acknowledged,
    active gap, not an oversight on this repo's part, and check source_url directly given how live
    this is.


    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    There is no single question. Social capital, as defined by the OECD, is covered by a battery
    across four domains (personal relationships, social network support, civic engagement, and trust
    and cooperative norms), each with its own response scale. The six questions cover generalised
    trust ("On a scale of 0-10, where 0 is not at all, and 10 is completely, in general how much do
    you trust most people?"); neighbourhood belonging, social support and civic engagement (agree or
    disagree statements such as "I feel like I belong to this neighbourhood"); and volunteering and
    its frequency over the last 12 months. See the primary source for exact wording and response
    options.

    If you also use the Crime and fear of crime harmonised standard, the source asks you to "check
    to remove any overlaps between questions".

    No age scope is stated. Published in 2021 "whilst under development"; priorities moved away from
    further development in 2022.


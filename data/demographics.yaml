- id: ons-marital-civil-partnership-status-standard
  label: Marital and civil partnership status harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-01
  source_published: 2020-11-27
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/marital-or-partnership-status/
  applies_to: []  # no blanket age stated; see notes on the 2022 minimum-age legislation
  use_case: [demographic-survey]
  question: "What is your legal marital or registered civil partnership status?"
  values:
    - "Never married and never legally registered in a civil partnership"
    - "Married"
    - "In a legally registered civil partnership"
    - "Separated but still legally married"
    - "Separated but still legally in a civil partnership"
    - "Divorced"
    - "Formerly in a civil partnership which is now legally dissolved"
    - "Widowed"
    - "A surviving member of a legally registered civil partnership"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The source discusses the Marriage and Civil Partnership (Minimum Age) Act 2022, which raised the legal
    minimum age to marry or register a civil partnership to 18 in England and Wales, and recommends "soft
    checks, such as interviewer prompt" where a respondent under 18 selects a married/partnered category,
    to catch likely data-entry errors rather than block a response outright. Mode guidance: "For online
    surveys, response options should be tick boxes, and respondents should only select one answer," and for
    face-to-face interviews, "using showcards... to help the respondent remember the possible response
    options." The standard explicitly states it "will not provide insight into persons who are: living
    together, or 'cohabiting'... in casual, dating or long-term relationships... engaged to be married;
    engaged to enter a civil partnership" — a separate "Cohabitation harmonised standard" exists at
    https://analysisfunction.civilservice.gov.uk/policy-store/cohabitation for that gap, not reproduced as
    its own entry here.

- id: ons-household-relationships-standard
  label: Household relationships harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-01
  source_published: 2020-11-27
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/household-relationships/
  applies_to: []  # asked at household level, not individually age-scoped — same reasoning as ons-tenure-standard
  use_case: [demographic-survey]
  question: "How are members of this household related to each other? [Person 1] is the … of [Person 2]."
  values:
    - "Husband or wife"
    - "Legally registered civil partner"
    - "Partner"
    - "Son or daughter (including adopted child)"
    - "Stepchild"
    - "Son-in-law or daughter-in-law"
    - "Father or mother (including adopted parent)"
    - "Stepfather or stepmother"
    - "Father-in-law or mother-in-law"
    - "Brother or sister (including half brother or sister)"
    - "Stepbrother or stepsister"
    - "Brother-in-law or sister-in-law"
    - "Grandson or granddaughter"
    - "Grandfather or grandmother"
    - "Other relative"
    - "Unrelated"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    "These questions can be used in both self-complete (such as online or paper) and interviewer-led (such
    as telephone or face-to-face) surveys" — a question stem was added specifically so the standard works
    in self-complete modes, and "unrelated" replaces the interview-mode wording "other non-relative" in
    self-complete mode since, per the source, it "makes more grammatical sense." "Cohabiting" was tested and
    dropped from the option list as "poorly understood," leaving "Partner" to cover that relationship
    instead. The source ties this standard's comparability to Census 2021 (England & Wales; Northern
    Ireland) and Census 2022 (Scotland), and states it "is designed to collect basic information, for use
    in the majority of surveys. It is not designed to replace questions used in specialist surveys where
    more detailed analysis is required." A related but distinct "Household reference person harmonised
    standard" exists at
    https://analysisfunction.civilservice.gov.uk/policy-store/household-reference-person/ for identifying
    which household member's characteristics a survey uses as the reference point — not reproduced as its
    own entry here.

- id: ons-unpaid-care-standard
  label: Unpaid care harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: under-review
  last_reviewed: 2026-09-01
  source_published: 2020-01-24
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/unpaid-care
  applies_to: []  # no age scope stated for the recommended question itself
  use_case: [demographic-survey]
  question: >-
    Do you look after, or give any help or support to, anyone because they have long-term physical or
    mental health conditions or illnesses, or problems related to old age? Exclude anything you do as part
    of your paid employment
  values:
    - "No"
    - "Yes, 9 hours a week or less"
    - "Yes, 10 to 19 hours a week"
    - "Yes, 20 to 34 hours a week"
    - "Yes, 35 to 49 hours a week"
    - "Yes, 50 or more hours a week"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: the source page carries an explicit "this page is awaiting an update" banner, pointing to a
    Census 2021 output article in the meantime, and states plainly: "No consistent question on unpaid care
    is currently used across the UK. A 2019 review identified 23 surveys collecting information on unpaid
    care." The question/values above are the source's own recommended wording from the 2019 Census Dress
    Rehearsal, explicitly flagged as self-completion only: "This is for self-completion surveys. The GSS
    harmonisation team are proposing to develop an equivalent question for interviewer-led data collection"
    — that interviewer-led version does not yet exist. Devolved variation: Northern Ireland's proposed
    question merges the first two England & Wales bands into a single "Yes, 19 hours a week or less"
    category; Scotland's question "will not change from the 2011 Census." The source itself caveats the
    recommended question as combining whether-a-person-cares and hours-of-care into one question, not
    specifying who is being cared for or residency requirements, and not offering a "varying hours" option
    — listed factors affecting comparability across the 23 identified surveys, not fully resolved by this
    standard.

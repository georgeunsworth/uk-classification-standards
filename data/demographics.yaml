- id: ons-crime-fear-of-crime-standard
  label: Crime and fear of crime harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-04
  source_published: 2018-03-01  # Version 3.4, March 2018 (formatting/contact-details-only update; see notes)
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/crime-and-fear-of-crime/
  applies_to: [adults]
  use_case: [demographic-survey]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — the underlying PDF is marked "© Crown
    Copyright" directly. See also this repo's LICENSE and README "Sources & licensing" section. Safe to
    reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: question and values are both left null because there is no single harmonised question here —
    the source states "The lead survey for questions on crime and fear of crime is the British Crime Survey
    (BCS). The questions are structured into four main blocks: Feeling Safe, Worries about Crime, Crime Rate
    in Area, and Problem in Area. However, users who wish to use questions on crime and fear of crime are not
    obliged to use all four blocks on their surveys, but only those that are applicable for their survey
    needs" — a pick-and-choose battery, not one fixed question, of roughly 20 individual items across the four
    blocks. Representative examples verified directly against the underlying PDF: Feeling Safe — "How safe do
    you feel walking alone in this area after dark?" (Very safe / Fairly safe / A bit unsafe / Very unsafe);
    Worries about Crime — "How worried are you about... having your home broken into and something stolen?"
    (Very worried / Fairly worried / Not very worried / Not at all worried), repeated for mugging, car theft,
    rape, physical attack by strangers, street harassment, and racially/religiously motivated attack; Crime
    Rate in Area — "How much would you say the crime rate here has changed since two years ago?" (a
    lot/little more crime / about the same / a little/lot less crime); Problem in Area — "How much of a
    problem are... noisy neighbours or loud parties?" (Very big problem / Fairly big problem / Not a very big
    problem / Not a problem at all), repeated for teenagers hanging around, rough sleeping, litter, vandalism,
    racial harassment, drug use, and public drunkenness — see source_url for the complete ~20-item set and
    routing. "This Area" is defined throughout as "within fifteen minutes of walking distance from the
    respondent's home." The questions are confirmed "directed towards adults (age 16+)"; the same source page
    points to the separate Crime and Criminal Justice Survey (CCJS) and the 1998 Youth Lifestyle Survey
    (age 10+) for children, not reproduced here. The source also flags the same cross-topic overlap noted in
    the ons-social-capital-standard entry above, in the other direction. IMPORTANT STALENESS FLAG: the
    document's own version history (Version 3.4, March 2018) shows every revision since Version 1.0 (June
    2004) has been a formatting or contact-details change only — "There has been no change to the harmonised
    questions" since 2004 — and it still names its lead survey "the British Crime Survey (BCS)," a name
    retired in 2012 when the survey was renamed the Crime Survey for England and Wales (CSEW); this rename
    was not found reflected anywhere on the live page or in the PDF during this session. No archived,
    superseded, or under-review banner was found on the live page itself, so this is recorded as current
    (matching this file's ons-tenure-standard/ons-economic-activity-status-standard precedent for stale-but-
    not-formally-reviewed standards) — but the BCS/CSEW naming mismatch above should prompt direct
    re-verification before relying on this as an up-to-date reflection of ONS's current crime-survey wording.

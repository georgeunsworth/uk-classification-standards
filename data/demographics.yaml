- id: ons-marital-civil-partnership-status-standard
  label: Marital and civil partnership status harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-01
  source_published: 2020-11-27
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/marital-or-partnership-status/
  applies_to: []  # no blanket age stated; see notes on the 2022 minimum-age legislation
  use_case: [demographic-survey]
  question: "What is your legal marital or registered civil partnership status?"
  values:
    - "Never married and never legally registered in a civil partnership"
    - "Married"
    - "In a legally registered civil partnership"
    - "Separated but still legally married"
    - "Separated but still legally in a civil partnership"
    - "Divorced"
    - "Formerly in a civil partnership which is now legally dissolved"
    - "Widowed"
    - "A surviving member of a legally registered civil partnership"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    The source discusses the Marriage and Civil Partnership (Minimum Age) Act 2022, which raised the legal
    minimum age to marry or register a civil partnership to 18 in England and Wales, and recommends "soft
    checks, such as interviewer prompt" where a respondent under 18 selects a married/partnered category,
    to catch likely data-entry errors rather than block a response outright. Mode guidance: "For online
    surveys, response options should be tick boxes, and respondents should only select one answer," and for
    face-to-face interviews, "using showcards... to help the respondent remember the possible response
    options." The standard explicitly states it "will not provide insight into persons who are: living
    together, or 'cohabiting'... in casual, dating or long-term relationships... engaged to be married;
    engaged to enter a civil partnership" — a separate "Cohabitation harmonised standard" exists at
    https://analysisfunction.civilservice.gov.uk/policy-store/cohabitation for that gap, not reproduced as
    its own entry here.


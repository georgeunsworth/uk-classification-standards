- id: ons-crime-fear-of-crime-standard
  label: Crime and fear of crime harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-04
  source_published: 2018-03-01  # Version 3.4, March 2018 (formatting/contact-details-only update; see notes)
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/crime-and-fear-of-crime/
  applies_to: [adults]
  use_case: [demographic-survey]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — the underlying PDF is marked "© Crown
    Copyright" directly. See also this repo's LICENSE and README "Sources & licensing" section. Safe to
    reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    There is no single question. The lead survey is the British Crime Survey, and the battery has
    roughly 20 items in four blocks: Feeling Safe, Worries about Crime, Crime Rate in Area, and
    Problem in Area. Users "are not obliged to use all four blocks on their surveys, but only those
    that are applicable for their survey needs".

    Examples include "How safe do you feel walking alone in this area after dark?" and "How worried
    are you about... having your home broken into and something stolen?", repeated for other crimes.
    See the primary source for the full set, response options and routing. The area means "within
    fifteen minutes of walking distance from the respondent's home."

    The questions are "directed towards adults (age 16+)". For children, the source points to the
    Crime and Criminal Justice Survey and the 1998 Youth Lifestyle Survey (age 10+). It also notes
    overlap with the Social capital harmonised standard entry.

    The questions are unchanged since version 1.0 (June 2004); later versions, up to 3.4 (March
    2018), changed only formatting and contact details. The document still names the British Crime
    Survey, renamed the Crime Survey for England and Wales in 2012, and neither the page nor the PDF
    reflects this. There is no archived or under-review banner, so it is recorded as current. Check
    it against ONS's current crime survey wording before relying on it.

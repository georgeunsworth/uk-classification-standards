    concludes — treat as current, not archived. Source states the question was "tested and
    designed for use with adult respondents aged 16 and over"; for younger children it says
    "guidance from parents/guardians may be needed" — looser wording than the formal proxy-response
    rule used by some other standards, worth re-checking against source_url if the exact mechanism
    matters for your form. The same page also states, of language as a related concept: "currently
    a GSS wide harmonised standard is not offered due to a lack of user need" — see the
    ons-language-standard-gap entry below.

- id: ons-disability-equality-act-2010
  label: Measuring disability for the Equality Act 2010 (harmonisation guidance)
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-08-30
  source_published: 2019-06-25
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/measuring-disability-for-the-equality-act-2010/
  applies_to: [adults, children-young-people]
  use_case: [demographic-survey]
  question: >-
    Does your condition or illness/do any of your conditions or illnesses reduce your ability to
    carry out day-to-day activities?
  values:
    - "Yes, a lot"
    - "Yes, a little"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    This is the second half of the official Equality Act 2010 "disabled person" test — a
    respondent only qualifies as disabled under the Act if they answer affirmatively to BOTH this
    question AND the long-lasting-conditions question already tracked as the
    ons-long-lasting-health-conditions entry in the mental-health domain. Only the two affirmative
    categories were confirmed from the source; a "No"/negative category presumably also exists but
    wasn't confirmed verbatim here — check source_url for the complete option set before using this
    in a live eligibility check. Updated 26 Apr 2023 as part of a 5-yearly Inclusive Data Taskforce
    review (draft revised questions were expected by 2025 — re-check currency). Source confirms
    direct response for respondents aged 16 and over, proxy response permitted for under-16s and for
    respondents too ill to self-respond, and translator assistance for non-English speakers.

- id: ons-sex-standard-gap

- id: ons-economic-activity-status-standard
  label: Economic activity status harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-01
  source_published: 2018-04-01  # "Version 3.5, April 2018" per the underlying PDF
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/economic-activity-status-ns-sec-and-employment-related-questions-harmonised-standard/
  applies_to: [adults]
  use_case: [demographic-survey]
  question: null
  values:
    - "Employees"
    - "Self-employed"
    - "All in employment"
    - "ILO unemployed"
    - "All economically active"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: there is no single "what is your economic activity status?" question — the classification
    above is derived from a battery of roughly 15 questions, so question is left null rather than picking
    one and implying it's the whole picture. The gateway question, asked IF AGE >= 16, is verbatim: "Did
    you do any paid work in the seven days ending Sunday the (n), either as an employee or as
    self-employed?" (Yes/No), followed by further questions on government training schemes (asked only if
    age 16-64, since the source notes "men and women aged over 64 are not on government schemes, by
    definition"), being away from a job, unpaid work for a family business, job-seeking, and full-time
    education — see source_url for the complete question set and routing. Economically inactive is
    everything not captured above ("all others"), not a category respondents are asked to self-select.
    This is the same source document as the ons-nssec-standard entry below (Version 3.5, April 2018),
    which also derives from this question battery. The source itself notes these harmonised outputs
    "differ in minor respects from the International Labour Office (ILO) standards followed in the Labour
    Force Survey," that the government-training-scheme category "is not separately identified because the
    harmonised question does not identify all such persons," and that unpaid family workers "are not shown
    separately" due to sample size. A review was flagged as due in "2018/2019" in the source text itself;
    no newer version has been published since — current but stale, the same pattern as this repo's
    ons-tenure-standard entry. Use of these questions is explicitly stated as optional for survey teams.

- id: ons-nssec-standard
  label: National Statistics Socio-economic Classification (NS-SEC) harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-01
  source_published: 2018-04-01  # same "Version 3.5, April 2018" document as economic activity status
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/economic-activity-status-ns-sec-and-employment-related-questions-harmonised-standard/
  applies_to: [adults]
  use_case: [demographic-survey]
  question: null
  values:
    - "1. Higher managerial and professional occupations"
    - "1.1 Large employers and higher managerial occupations"
    - "1.2 Higher professional occupations"
    - "2. Lower managerial and professional occupations"
    - "3. Intermediate occupations"
    - "4. Small employers and own account workers"
    - "5. Lower supervisory and technical occupations"
    - "6. Semi-routine occupations"
    - "7. Routine occupations"
    - "8. Never worked and long-term unemployed"
    - "Not classified"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: NS-SEC is not asked directly — question is left null because deriving it needs 8 further
    questions from the same source document: three on occupation ("What did the firm/organisation you
    worked for mainly make or do (at the place where you worked)?"; "What was your (main) job (in the week
    ending Sunday the xx)?"; "What did you mainly do in your job?") and five on employment status/
    organisation size ("Were you working as an employee or were you self-employed?"; a supervisory-
    responsibility question; organisation-size bands of "1-24", "25-499", "500 or more"; and, for the
    self-employed branch, whether working alone or with employees). The 8-class list above is the source's
    primary "analytic version" (its first class, 1, can be subdivided into 1.1/1.2 as shown); 5-class and
    3-class versions also exist in the same document for coarser analysis — see source_url for both.
    Priority order for full adult population coverage is: full-time students, long-term unemployed, never
    worked, NS-SEC from current/last main job, then "not classified" for anyone whose occupation is
    inadequately described. IMPORTANT STALENESS FLAG: this document (last dated 2018) derives NS-SEC using
    the SOC2010 occupational classification; ONS has since rebased NS-SEC onto SOC2020 (see SOC 2020 Volume
    3, cited in the ons-soc2020-standard entry in official-classifications.yaml), a rebase not reflected in
    this GSS harmonisation-standard text — check ONS's occupational classification guidance directly if
    SOC2020 alignment matters for a live service. Distinct from, but related to, the newer
    "Socio-economic background harmonised standard" (published 2023, source_url
    https://analysisfunction.civilservice.gov.uk/policy-store/socio-economic-background-harmonised-standard/),
    which asks retrospectively about parental/childhood circumstances at age ~14 rather than the
    respondent's own current/last occupation — a "see also," not a substitute for this entry.

- id: ons-qualifications-standard
  label: Qualifications harmonised standard
  source: ONS / GSS Harmonisation Team

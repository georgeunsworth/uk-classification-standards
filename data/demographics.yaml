- id: ons-economic-activity-status-standard
  label: Economic activity status harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-01
  source_published: 2018-04-01  # "Version 3.5, April 2018" per the underlying PDF
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/economic-activity-status-ns-sec-and-employment-related-questions-harmonised-standard/
  applies_to: [adults]
  use_case: [demographic-survey]
  question: null
  values:
    - "Employees"
    - "Self-employed"
    - "All in employment"
    - "ILO unemployed"
    - "All economically active"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    There is no single economic activity question: the classification is derived from a battery of
    roughly 15 questions. The gateway question, asked only of those aged 16 or over, is "Did you do
    any paid work in the seven days ending Sunday the (n), either as an employee or as
    self-employed?" (Yes/No). Follow-ups cover government training schemes (ages 16 to 64 only),
    being away from a job, unpaid work for a family business, job-seeking and full-time education.
    See the primary source for the full set and routing. Economically inactive means everyone else;
    respondents do not select it.

    Use of the questions is optional. The outputs "differ in minor respects from the International
    Labour Office (ILO) standards followed in the Labour Force Survey". Government training schemes
    and unpaid family workers are not identified as separate categories.

    This is the same document (version 3.5, April 2018) as the National Statistics Socio-economic
    Classification (NS-SEC) harmonised standard entry. A review was due in 2018/2019, but no newer
    version has been published. Treat it as current but stale.

- id: ons-nssec-standard
  label: National Statistics Socio-economic Classification (NS-SEC) harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-01
  source_published: 2018-04-01  # same "Version 3.5, April 2018" document as economic activity status
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/economic-activity-status-ns-sec-and-employment-related-questions-harmonised-standard/
  applies_to: [adults]
  use_case: [demographic-survey]
  question: null
  values:
    - "1. Higher managerial and professional occupations"
    - "1.1 Large employers and higher managerial occupations"
    - "1.2 Higher professional occupations"
    - "2. Lower managerial and professional occupations"
    - "3. Intermediate occupations"
    - "4. Small employers and own account workers"
    - "5. Lower supervisory and technical occupations"
    - "6. Semi-routine occupations"
    - "7. Routine occupations"
    - "8. Never worked and long-term unemployed"
    - "Not classified"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    NS-SEC is derived, not asked directly. It needs 8 questions from the same document. Three cover
    occupation: "What did the firm/organisation you worked for mainly make or do (at the place where
    you worked)?", "What was your (main) job (in the week ending Sunday the xx)?" and "What did you
    mainly do in your job?". Five cover employment status and organisation size: "Were you working
    as an employee or were you self-employed?", a supervisory responsibility question, organisation
    size bands (1-24, 25-499, 500 or more) and, for the self-employed, whether they work alone or
    with employees. See the primary source for the full wording and routing.

    The options shown are the 8-class analytic version, with class 1 split into 1.1 and 1.2. The
    document also has 5-class and 3-class versions. For full adult coverage, classify in this order:
    full-time students, long-term unemployed, never worked, current or last main job, then not
    classified where the occupation is inadequately described.

    The document (2018) derives NS-SEC from SOC2010. ONS has since rebased NS-SEC onto SOC2020 (see
    SOC 2020 Volume 3, cited in the Standard Occupational Classification 2020 (SOC 2020) entry), and
    this text does not reflect that. If SOC2020 alignment matters, check ONS's occupational
    classification guidance.

    The Socio-economic background harmonised standard entry is related but not a substitute: it asks
    about parental circumstances at about age 14, not the respondent's own occupation.

- id: ons-qualifications-standard
  label: Qualifications harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-01
  source_published: 2022-08-31
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/qualifications-harmonised-standard/
  applies_to: []  # no single blanket age stated; Scotland/non-UK school-qualification sub-questions are scoped to 14+, not the whole standard
  use_case: [demographic-survey]
  question: null
  values:
    - "Degree Equivalent or Above"
    - "Higher Education"
    - "GCE A Level or Equivalent"
    - "GCSE Grades A*-C or Equivalent"
    - "GCSE Grades D-G or Below"
    - "No Qualifications"
    - "Unclassified"
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    Highest qualification is derived, not asked as one question. The 7 output categories come from a
    routed battery of roughly 100 variables. A gate question ("In the past, in which of these places
    did you gain your qualifications?") routes to blocks for England, Wales and Northern Ireland
    school qualifications, Scotland and non-UK school qualifications (both from age 14), current
    apprenticeships, and college, professional and university qualifications. See the primary source
    for the questions, routing and lookup tables.

    It "is suitable for online self-completion modes. It is not suitable for paper self-completion
    because of the complicated routing". For a telephone version, contact the Harmonisation team
    rather than adapting it yourself. Welsh-language versions exist. The source expects the
    questions to need updating as new qualifications appear.

    The older Educational attainment harmonised standard (2020, 3 questions, interviewer-led) is a
    paused fallback, not a current alternative: it "has not been further developed or updated since"
    priorities shifted in 2022. It has no entry of its own.


- id: ons-personal-wellbeing-standard
  label: Personal wellbeing harmonised standard (ONS4)
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: current
  last_reviewed: 2026-09-04
  source_published: 2020-05-19
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/personal-well-being/
  applies_to: []  # no age scope stated on this page
  use_case: [demographic-survey]
  question: null  # 4-item instrument sharing a 0-10 scale — see items/response_scale/scoring below
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items:
    - id: ons4-item-1
      text: "Overall, how satisfied are you with your life nowadays?"
    - id: ons4-item-2
      text: "Overall, to what extent do you feel that the things you do in your life are worthwhile?"
    - id: ons4-item-3
      text: "Overall, how happy did you feel yesterday?"
    - id: ons4-item-4
      text: >-
        On a scale where 0 is "not at all anxious" and 10 is "completely anxious", overall, how anxious did
        you feel yesterday?
  response_scale:
    instruction: >-
      For each of these questions, give an answer on a scale of 0 to 10, where 0 is "not at all" and 10 is
      "completely" — the anxiety item (item 4) instead anchors its own 0-10 scale at "not at all anxious"/
      "completely anxious", as shown in its item text above, rather than sharing the generic "not at
      all"/"completely" wording used for the other three. The source states these four questions "should be
      used together, in the order they are presented," and that "different collection modes can affect
      responses" so data collected in different modes should not be compared.
    options:
      - {label: "0", score: 0}
      - {label: "1", score: 1}
      - {label: "2", score: 2}
      - {label: "3", score: 3}
      - {label: "4", score: 4}
      - {label: "5", score: 5}
      - {label: "6", score: 6}
      - {label: "7", score: 7}
      - {label: "8", score: 8}
      - {label: "9", score: 9}
      - {label: "10", score: 10}
  scoring:
    method: >-
      Each of the 4 items produces its own separate 0-10 score, read individually — unlike PHQ-9, ONS4 does
      not sum the 4 items into one combined total.
    bands:
      - {min: 0, max: 4, label: "Low"}
      - {min: 5, max: 6, label: "Medium"}
      - {min: 7, max: 8, label: "High"}
      - {min: 9, max: 10, label: "Very high"}
    clinical_note: >-
      IMPORTANT: the bands above are ONS's published thresholds for the life-satisfaction, worthwhileness,
      and happiness-yesterday items ONLY. The anxiety-yesterday item uses a distinct, reversed set of
      thresholds published on the same source page, which the single shared "bands" list above can't also
      represent: 0-1 "Very low", 2-3 "Low", 4-5 "Medium", 6-10 "High" anxiety — for this item a HIGHER score
      is the less favourable outcome, the opposite direction to the other three. Always check which item a
      score belongs to before applying a band from this list.
  notes: >
    The four ONS4 questions share a 0 to 10 scale and "should be used together, in the order they
    are presented". Each item is scored and read on its own; the four scores are never added up.

    The anxiety item differs from the other three in two ways. Its scale is anchored at "not at all
    anxious" and "completely anxious". Its thresholds are also reversed: a higher score is the less
    favourable outcome. Check which item a score belongs to before applying a band.

    The source does not state an age scope. It has no review-status statement, so it is treated as
    current.


    reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    There is no fixed survey question. The underlying document (GSS Harmonised Principle: Migration,
    Country of Birth and Citizenship, version 1.0, February 2018) is a glossary of 26 concepts and
    their approved definitions, including country of birth, country of usual residence,
    long/short-term international migrant, nationality, citizenship, passports held, asylum
    applicant and refugee. See the primary source for the full list. Surveys such as the Census, the

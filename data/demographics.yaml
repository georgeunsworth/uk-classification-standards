    migration transitions) rather than a single question-and-answer pair — individual surveys (the Census, the
    Annual Population Survey, the International Passenger Survey, etc.) each implement their own question
    wording aligned to these shared definitions, which this repo hasn't independently verified survey-by-survey.
    The one concrete survey question quoted directly within the source document itself is for the "Nationality"
    concept: "The Annual Population Survey, which underlies the population estimates by nationality, simply
    asks people 'what is your nationality?'" — reproduced here as the one verifiable example, not as this
    repo's confirmed universal recommended wording for the whole topic area. Country of birth responses are
    coded against the external National Statistics Country Classification (2011 Census Variable and
    Classification Information, Part 3), not reproduced here — no compact response list is published in this
    document itself. Kept as a single entry (rather than split into separate country-of-birth/nationality/
    citizenship entries) because the source itself structures all 26 concepts under one harmonised principle
    document. No age scope is stated. No explicit review/currency banner was found, though the document itself
    is unrevised since February 2018 and the page notes the linked PDF "does not meet the current accessibility
    standards" and will be reformatted "when we update this harmonised principle" — treated as current but
    worth re-checking directly given its age, the same pattern as this file's ons-tenure-standard entry.


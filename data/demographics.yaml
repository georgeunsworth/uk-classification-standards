    meantime. It states: "No consistent question on unpaid care is currently used across the UK." A
    2019 review found 23 surveys collecting it.

    The question shown is the recommended wording from the 2019 Census Dress Rehearsal, for
    self-completion only. The team proposes to develop an interviewer-led version, which does not
    yet exist.

    Northern Ireland's proposed version merges the first two bands into "Yes, 19 hours a week or
    less". Scotland's question "will not change from the 2011 Census."

    Known limits: the question combines whether someone cares with their hours of care, does not ask
    who is cared for or cover residency, and has no varying-hours option.


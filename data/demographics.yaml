  source_published: 2018-02-01  # "Version 1.0, February 2018" per the underlying PDF; exact day unconfirmed
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/migration-country-of-birth-and-citizenship/
  applies_to: []  # no age scope stated
  use_case: [demographic-survey]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — the underlying PDF is marked "© Crown
    Copyright" directly. See also this repo's LICENSE and README "Sources & licensing" section. Safe to
    reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: unlike most entries in this file, this standard doesn't publish one fixed survey question at
    all — question and values are both left null because the underlying document ("GSS Harmonised Principle:
    Migration, Country of Birth and Citizenship," Version 1.0, ONS, February 2018) is a glossary of 26 target
    concepts and their approved definitions (address of usual residence, country of usual residence, country
    of birth, long/short-term international migrant, year and month of arrival in the UK, ever lived abroad,
    visitor/migrant switchers, returning migrants, national identity, nationality, citizenship/country of
    citizenship, citizenship at birth, passports held, length of stay, reason for visit, internal/cross-border

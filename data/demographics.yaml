- id: ons-social-capital-standard
  label: Social capital harmonised standard
  source: ONS / GSS Harmonisation Team
  source_type: harmonised-standard
  status: under-review
  last_reviewed: 2026-09-04
  source_published: 2021-07-13
  source_url: https://analysisfunction.civilservice.gov.uk/policy-store/social-capital/
  applies_to: []  # no age scope stated
  use_case: [demographic-survey]
  question: null
  values: null
  licence_status: ogl
  licence_notes: >-
    UK Open Government Licence v3.0 (government/publisher content) — see this repo's LICENSE
    and README "Sources & licensing" section. Safe to reproduce with attribution.
  items: null
  response_scale: null
  scoring: null
  notes: >
    IMPORTANT: question and values are both left null because social capital isn't one question — it's a
    composite battery spanning four separate domains (personal relationships, social network support, civic
    engagement, and trust/cooperative norms), each with its own distinct response scale, so it doesn't share
    one response_scale the way a scored instrument like PHQ-9 or this file's ons-personal-wellbeing-standard
    entry does. The source uses the OECD definition: social capital is "networks together with shared norms,
    values and understandings that facilitates cooperation within or among groups." The six component
    questions found are: generalised trust ("On a scale of 0-10, where 0 is not at all, and 10 is completely,
    in general how much do you trust most people?"); neighbourhood belonging ("To what extent do you agree or
    disagree with the statement 'I feel like I belong to this neighbourhood'?"); social support ("...'I can
    rely on the people in my life if I have a serious problem'?"); civic engagement ("...'I don't have any say
    in what the government does'?"); volunteering participation ("Over the last 12 months, have you given any
    unpaid help to clubs, groups, charities or organisations?"); and volunteering frequency ("Thinking about
    all the unpaid help you provide to groups, clubs or organisations, how often have you done this over the
    last 12 months?") — see source_url for the full six-question set, exact response option wording for each,
    and further guidance. The source itself warns of overlap with the ons-crime-fear-of-crime-standard entry
    below: "there are overlaps between questions in the Crime and Fear of Crime section and the Social Capital
    section. If both sections are to be included in a survey, please check to remove any overlaps between
    questions." No age scope is stated. Currency: published in 2021 "whilst under development, so that users
    may benefit from the research that has been completed," with priorities shifting away from further
    development in 2022 — recorded as under-review, the same pattern as the other 2020/2021-era standards in
    this file.


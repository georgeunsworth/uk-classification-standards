    nationality?", as an example rather than a recommended wording.

    Country of birth is coded against the National Statistics Country Classification (2011 Census
    Variable and Classification Information, Part 3). The document has no compact response list.

    No age scope is stated. There is no review banner, but the document is unrevised since February
    2018, and the page says the PDF will be reformatted "when we update this harmonised principle".
    Check the source given its age.

